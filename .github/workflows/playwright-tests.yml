name: Playwright Tests
#set up the trigger
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  # GitHub Actions schedules use UTC. 17:00 UTC is 12:00 PM EST.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:  #manually to run in github action

permissions:
  contents: read

jobs:
  playwright-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest    # virtual macine(ubuntu-latest for linux,windows-latest for windows,mac-latest for mac)
    timeout-minutes: 30  # maximum time the job can run before being automatically cancelled

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci  # equivalent to- npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run tests:headless

        env:  # mapping the secret to an environment variable that can be used in the tests
          PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
          PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}
        # generate a Playwright HTML report and test result
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

